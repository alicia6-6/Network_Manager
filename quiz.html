<title>문제 풀기 · 네트워크관리사 2급</title>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<link rel="stylesheet" href="css/style.css" />

<div class="wrap">
  <header class="site-header">
    <div class="brand"><span class="logo">🌐</span> 네트워크관리사 2급</div>
    <nav class="top-nav">
      <a href="index.html">홈</a>
      <a href="summary.html">요약노트</a>
      <a href="quiz.html?mode=wrong">오답노트</a>
    </nav>
  </header>

  <div class="hero">
    <h1 id="modeTitle">문제 풀기</h1>
    <p id="modeDesc"></p>
  </div>

  <div id="roundControls" style="display:none; gap:10px; align-items:center; margin-bottom:16px;">
    <select id="roundSelect" class="round-select"></select>
    <button id="startRoundBtn" class="btn" type="button">이 회차 풀기</button>
  </div>

  <div id="toolbar" class="quiz-toolbar" style="display:none;">
    <div class="progress-bar"><div id="progressBar"></div></div>
    <div id="progressText" style="font-size:0.82rem; color:var(--text-muted); min-width:56px;"></div>
    <div id="scoreText" style="font-size:0.82rem; font-weight:700; color:var(--primary-dark);"></div>
  </div>

  <div id="quizArea"></div>
  <div id="resultArea" style="display:none;"></div>
  <div id="emptyArea" style="display:none;"></div>

  <footer class="site-footer">
    네트워크관리사 2급 기출문제 학습 사이트 · 개인 학습용
  </footer>
</div>

<script src="js/data.js"></script>
